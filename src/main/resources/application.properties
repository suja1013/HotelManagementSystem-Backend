spring.application.name=AkantaraHotel

# The port number on which the app will run and can access the app at http://localhost:1008
server.port=1008

#MYSQL CONNECTION

# URL of the MySQL database for connection
spring.datasource.url=jdbc:mysql://localhost:3306/akantarahoteldb
spring.datasource.username=root
spring.datasource.password=root

# MySQL JDBC driver class name (needed for database connectivity)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tells Hibernate which SQL dialect to use.
# MySQLDialect ensures Hibernate generates MySQL-compatible SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Controls how Hibernate updates your database schema.
spring.jpa.hibernate.ddl-auto=update


#Dynamic Pricing: OpenWeatherMap Configuration
# Get a free API key at: https://openweathermap.org/api
# Replace the placeholder below with your actual key.
# If left blank the WeatherFactor defaults to 1.0 (neutral means no weather adjustment).
weather.api.key=deb7d1ac8dd09a689445d5ebcf215523

# The city used to fetch live weather conditions for pricing.
# Use the city name closest to your hotel (e.g. Jakarta, Bali, Singapore).
weather.city=Harrisburg